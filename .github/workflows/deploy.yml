name: Build and Deploy to EKS

on:
  push:
    branches: [main]
    paths:
      - 'microservices/**'
      - 'k8s/**'
  pull_request:
    branches: [main]
    paths:
      - 'microservices/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 468018987855.dkr.ecr.ap-southeast-1.amazonaws.com
  EKS_CLUSTER: eks-lab
  IAM_ROLE: arn:aws:iam::468018987855:role/eks-lab-github-actions

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      gateway: ${{ steps.changes.outputs.gateway }}
      frontend: ${{ steps.changes.outputs.frontend }}
      k8s: ${{ steps.changes.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'microservices/backend-service/**'
            gateway:
              - 'microservices/api-gateway/**'
            frontend:
              - 'microservices/frontend/**'
            k8s:
              - 'k8s/**'

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - service: backend-service
            changed: ${{ needs.detect-changes.outputs.backend }}
          - service: api-gateway
            changed: ${{ needs.detect-changes.outputs.gateway }}
          - service: frontend
            changed: ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      - name: Configure AWS credentials (OIDC)
        if: matrix.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: matrix.changed == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: matrix.changed == 'true'
        run: |
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_URI="${{ env.ECR_REGISTRY }}/eks-lab/${{ matrix.service }}"
          
          docker build -t ${IMAGE_URI}:${IMAGE_TAG} \
                       -t ${IMAGE_URI}:latest \
                       microservices/${{ matrix.service }}/
          
          docker push ${IMAGE_URI}:${IMAGE_TAG}
          docker push ${IMAGE_URI}:latest

  deploy:
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.gateway == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.k8s == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Update image tags in manifests
        run: |
          IMAGE_TAG="${{ github.sha }}"
          # Only update tags for services that were rebuilt
          if [ "${{ needs.detect-changes.outputs.backend }}" == "true" ]; then
            sed -i "s|eks-lab/backend-service:v[0-9.]*|eks-lab/backend-service:${IMAGE_TAG}|g" k8s/microservices.yaml
          fi
          if [ "${{ needs.detect-changes.outputs.gateway }}" == "true" ]; then
            sed -i "s|eks-lab/api-gateway:v[0-9.]*|eks-lab/api-gateway:${IMAGE_TAG}|g" k8s/microservices.yaml
          fi
          if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
            sed -i "s|eks-lab/frontend:v[0-9.]*|eks-lab/frontend:${IMAGE_TAG}|g" k8s/microservices.yaml
          fi

      - name: Deploy to EKS
        run: kubectl apply -f k8s/microservices.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend-service -n microservices --timeout=120s
          kubectl rollout status deployment/api-gateway -n microservices --timeout=120s
          kubectl rollout status deployment/frontend -n microservices --timeout=120s

      - name: Verify deployment
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n microservices
          echo ""
          echo "=== Services ==="
          kubectl get svc -n microservices
