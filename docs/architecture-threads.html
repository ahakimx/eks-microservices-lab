<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SRE Agent Architecture - Threads Optimized</title>
<style>body{margin:0;padding:0;background:#fff;}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">

    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>

      <polygon points="0 0, 8 3, 0 6" fill="#b85450"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0088CC"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1419"/>
      <stop offset="100%" style="stop-color:#1a2332"/>

  </defs>

  <!-- Dark background -->
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- Title -->
  <text x="540" y="70" text-anchor="middle" font-size="36" font-weight="bold" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif">SRE Agent Architecture</text>
  <text x="540" y="105" text-anchor="middle" font-size="18" fill="#8899aa" font-family="system-ui,-apple-system,sans-serif">Kubernetes Cluster Management via Chat</text>

  <!-- ===== USER + TELEGRAM (top) ===== -->
  <circle cx="200" cy="190" r="28" fill="#3a4a5a" stroke="#5a7a9a" stroke-width="2"/>
  <circle cx="200" cy="178" r="10" fill="#8899aa"/>
  <path d="M182 200 Q200 215 218 200" fill="none" stroke="#8899aa" stroke-width="2"/>
  <text x="200" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#ccddeeff" font-family="system-ui,sans-serif">SRE Engineer</text>

  <!-- Telegram box -->
  <rect x="350" y="168" width="160" height="50" rx="8" fill="#0088CC"/>
  <text x="430" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff" font-family="system-ui,sans-serif">Telegram</text>

  <line x1="230" y1="190" x2="348" y2="190" stroke="#0088CC" stroke-width="2.5" marker-end="url(#arr-b)"/>
  <text x="290" y="180" text-anchor="middle" font-size="11" fill="#0088CC" font-family="system-ui,sans-serif">ChatOps</text>

  <text x="800" y="202" text-anchor="middle" font-size="12" fill="#aa8888" font-family="system-ui,sans-serif">(Python on EC2 / OpenClaw)</text>

  <!-- Agent features -->
  <rect x="625" y="220" width="350" height="40" rx="6" fill="#1a2a2a" stroke="#4a6a6a"/>

  <rect x="625" y="270" width="350" height="40" rx="6" fill="#1a2a2a" stroke="#4a6a6a"/>
  <text x="800" y="295" text-anchor="middle" font-size="14" fill="#66ddaa" font-family="system-ui,sans-serif">Auto-Remediation</text>

  <rect x="625" y="320" width="350" height="40" rx="6" fill="#1a2a2a" stroke="#4a6a6a"/>
  <text x="800" y="345" text-anchor="middle" font-size="14" fill="#66ddaa" font-family="system-ui,sans-serif">ChatOps Commands</text>

  <rect x="625" y="370" width="350" height="40" rx="6" fill="#1a2a2a" stroke="#4a6a6a"/>
  <text x="800" y="395" text-anchor="middle" font-size="14" fill="#66ddaa" font-family="system-ui,sans-serif">Incident Reports</text>

  <text x="555" y="185" text-anchor="middle" font-size="10" fill="#0088CC" font-family="system-ui,sans-serif">commands</text>

  <!-- SRE Agent -> Telegram (alerts) -->

  <text x="555" y="225" text-anchor="middle" font-size="10" fill="#ff6b6b" font-family="system-ui,sans-serif">alerts</text>

  <text x="120" y="558" font-size="12" fill="#aa8855" font-family="system-ui,sans-serif">ap-southeast-1 | VPC 10.0.0.0/16 | 2x t3.medium Spot</text>

  <!-- Namespace: microservices -->
  <rect x="110" y="580" width="560" height="180" rx="8" fill="#1a2535" stroke="#4a8abf" stroke-width="1.5"/>
  <text x="130" y="605" font-size="13" font-weight="bold" fill="#6abaef" font-family="system-ui,sans-serif">namespace: microservices</text>

  <rect x="140" y="625" width="140" height="50" rx="6" fill="#ED7100"/>

  <text x="210" y="665" text-anchor="middle" font-size="10" fill="#ffddaa" font-family="system-ui,sans-serif">:3002</text>

  <rect x="320" y="625" width="140" height="50" rx="6" fill="#ED7100"/>
  <text x="390" y="648" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff" font-family="system-ui,sans-serif">api-gateway</text>
  <text x="390" y="665" text-anchor="middle" font-size="10" fill="#ffddaa" font-family="system-ui,sans-serif">:3001</text>

  <rect x="500" y="625" width="140" height="50" rx="6" fill="#ED7100"/>
  <text x="570" y="648" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff" font-family="system-ui,sans-serif">backend-svc</text>
  <text x="570" y="665" text-anchor="middle" font-size="10" fill="#ffddaa" font-family="system-ui,sans-serif">:3000</text>

  <!-- Service arrows -->
  <line x1="282" y1="650" x2="318" y2="650" stroke="#FF9900" stroke-width="2.5" marker-end="url(#arr-o)"/>
  <line x1="462" y1="650" x2="498" y2="650" stroke="#FF9900" stroke-width="2.5" marker-end="url(#arr-o)"/>

  <text x="390" y="720" text-anchor="middle" font-size="11" fill="#4a8abf" font-family="system-ui,sans-serif">↕ Network Policies (pod-to-pod restricted)</text>

  <!-- Namespace: monitoring -->
  <rect x="110" y="780" width="560" height="120" rx="8" fill="#1a2a1a" stroke="#5a9a5a" stroke-width="1.5"/>
  <text x="130" y="805" font-size="13" font-weight="bold" fill="#7acc7a" font-family="system-ui,sans-serif">namespace: monitoring</text>

  <rect x="140" y="825" width="140" height="45" rx="6" fill="#9B1B5A"/>

  <text x="380" y="852" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="system-ui,sans-serif">Alertmanager</text>

  <rect x="480" y="825" width="140" height="45" rx="6" fill="#9B1B5A"/>
  <text x="550" y="852" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="system-ui,sans-serif">Grafana</text>

  <text x="840" y="705" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="system-ui,sans-serif">IAM (OIDC + IRSA)</text>

  <rect x="730" y="735" width="220" height="40" rx="5" fill="#9B1B5A"/>
  <text x="840" y="760" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="system-ui,sans-serif">CloudWatch Logs</text>

  <rect x="730" y="790" width="220" height="40" rx="5" fill="#6B3FA0"/>
  <text x="840" y="815" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="system-ui,sans-serif">ALB (Public)</text>

  <rect x="730" y="845" width="220" height="40" rx="5" fill="#1B7D3A"/>
  <text x="840" y="870" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="system-ui,sans-serif">EBS CSI (IRSA)</text>

  <!-- SRE Agent -> EKS (kubectl) -->
  <path d="M800 457 L800 498" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arr-r)"/>
  <text x="820" y="480" font-size="12" font-weight="bold" fill="#ff6b6b" font-family="system-ui,sans-serif">kubectl</text>

  <!-- GitHub Actions -->
  <rect x="110" y="940" width="250" height="50" rx="8" fill="#1B1F23" stroke="#555" stroke-width="1"/>
  <text x="235" y="965" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" font-family="system-ui,sans-serif">GitHub Actions</text>
  <text x="235" y="982" text-anchor="middle" font-size="10" fill="#8899aa" font-family="system-ui,sans-serif">OIDC — no stored credentials</text>

  <path d="M362 965 L730 645" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- ===== LEGEND ===== -->
  <rect x="80" y="1100" width="920" height="200" rx="10" fill="#111822" stroke="#333" stroke-width="1"/>
  <text x="540" y="1135" text-anchor="middle" font-size="16" font-weight="bold" fill="#ccc" font-family="system-ui,sans-serif">Legend</text>

  <line x1="120" y1="1165" x2="170" y2="1165" stroke="#FF9900" stroke-width="3" marker-end="url(#arr-o)"/>
  <text x="185" y="1170" font-size="13" fill="#ddd" font-family="system-ui,sans-serif">Service traffic flow</text>

  <line x1="120" y1="1195" x2="170" y2="1195" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="185" y="1200" font-size="13" fill="#ddd" font-family="system-ui,sans-serif">kubectl (SRE Agent → EKS)</text>

  <line x1="120" y1="1225" x2="170" y2="1225" stroke="#0088CC" stroke-width="3"/>
  <text x="185" y="1230" font-size="13" fill="#ddd" font-family="system-ui,sans-serif">ChatOps (User ↔ Agent ↔ Telegram)</text>

  <line x1="560" y1="1165" x2="610" y2="1165" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="625" y="1170" font-size="13" fill="#ddd" font-family="system-ui,sans-serif">CI/CD (GitHub → AWS)</text>

  <line x1="560" y1="1195" x2="610" y2="1195" stroke="#5a9a5a" stroke-width="2"/>
  <text x="625" y="1200" font-size="13" fill="#ddd" font-family="system-ui,sans-serif">Monitoring namespace</text>

  <line x1="560" y1="1225" x2="610" y2="1225" stroke="#4a8abf" stroke-width="2"/>
  <text x="625" y="1230" font-size="13" fill="#ddd" font-family="system-ui,sans-serif">Microservices namespace</text>

  <!-- Footer -->
  <text x="540" y="1270" text-anchor="middle" font-size="12" fill="#556677" font-family="system-ui,sans-serif">github.com/ahakimx/eks-microservices-lab</text>
